<script>
const sections=[{"title": "Dedication", "start": 3, "end": 3, "pages": [{"page": 3, "text": "Dedication\nI dedicate this book to my parents, my teachers and\neveryone who sincerely seeks knowledge. May Allah\nincrease us in beneficial knowledge and guide us to\nthe truth. Ameen"}]}, {"title": "Preface", "start": 4, "end": 4, "pages": [{"page": 4, "text": "Preface\nIn the name of Allah, the Most Gracious, the Most\nMerciful.\nI wrote this book because I have always been\ncurious about the relationship between the Holy\nQur'an and the natural world. As a student, I wanted\nto learn how the Quran encourages people to think,\nobserve, and seek knowledge. While studying\nscience, I found that many people discuss possible\nconnections between certain Quranic verses and\nmodern scientific discoveries. This inspired me to\nresearch these topics and present them in simple\nlanguage.\nThe purpose of this book is not to claim that the\nQuran is a science textbook or that every scientific\ndiscovery is mentioned in it. Rather, it is to explore\nhow many readers and scholars understand certain\nverses in light of modern scientific knowledge. I\nhope this book encourages readers to reflect,\ncontinue learning, and appreciate both faith and the\nwonders of Allah's creation."}]}, {"title": "Contents", "start": 5, "end": 5, "pages": [{"page": 5, "text": "S. No. 01\nIntroduction\nPage no. 06\nS. No. 02\nThe expanding\nuniverse\nPage no. 08\nS. No. 03\nWater: The origin of\nlife\nPage no. 11\nS. No. 04\nHuman embryonic\ndevelopment\nPage no. 14\nS. No. 05\nThe barrier between\ntwo seas\nPage no. 18\nS. No. 06\nThe protective Sky\nPage no. 22\nS. No. 07\nIron: A remarkable gift\nPage no. 25\nS. No. 08\nFingerprints: A sign of\nindividual identify\nPage no. 29\nS. No. 09\nThe orbits of the Sun\nand the moon\nPage no.33\nS. No. 10\nThe mountains and\nthe earth\nPage no. 38\nS. No. 11\nThe water cycle\nPage no. 42\nS. No. 12\nThe Bee and honey\nPage no. 46\nS. No. 13\nDarkness in the deep\nocean\nPage no. 50\nS. No. 14\nThe Big Bang and the\norigin of the universe\nPage no. 54\nS. No. 15\nPain receptors in the\nSkin\nPage no. 58\nS. No. 16\nFinal thoughts: Faith\nand science\nPage no. 62\nS. No. 17\nAbout the author\nPage no. 68"}]}, {"title": "Introduction", "start": 6, "end": 7, "pages": [{"page": 6, "text": "Introduction\nFor more than fourteen centuries, the\nQur'an has invited people to observe the\nheavens, the Earth, and themselves. It\nrepeatedly encourages reflection on the\nsigns of creation and the search for\nknowledge.\nIn recent centuries, scientific\ndiscoveries have greatly increased our\nunderstanding of the universe, life, and\nnature. Some Muslims believe that\ncertain Qur'anic verses are remarkably\nconsistent with these discoveries.\nOthers emphasize that the primary\npurpose of the Qur'an is spiritual\nguidance, not to serve as a science\ntextbook."}, {"page": 7, "text": "This book explores several Qur'anic\npassages alongside modern scientific\nknowledge. It does not claim that every\nscientific idea is mentioned in the Qur'an,\nnor that science has conclusively proved\nthe Qur'an. Instead, it presents the\nverses, summarizes current scientific\nunderstanding, and allows readers to\nreflect thoughtfully on possible\nconnections.\nMay this book encourage both faith and\na love of learning, while inspiring readers\nto appreciate the wonders of creation."}]}, {"title": "The expanding universe", "start": 8, "end": 10, "pages": [{"page": 8, "text": "The expending universe\nQURANIC VERSE\n\"And the heaven We built with strength,\nand indeed, We are expanding it.\"\n[Surah Adh-Dhariyat (51:47)]\nMODERN SCIENTIFIC UNDERSTAND:\nIn the early 20th century, astronomers\ndiscovered that the universe is\nexpanding. In 1929, Edwin Hubble\nobserved that distant galaxies are\nmoving away from one another. This\ndiscovery led to the modern\nunderstanding that the universe has"}, {"page": 9, "text": "been expanding since the Big Bang.\nToday, the expansion of the universe is\na well-established part of modern\ncosmology and is supported by many\nobservations.\nREFLECTION:\nMany Muslim scholars and writers see a\nconnection between Surah Adh-Dhariyat\n(51:47) and the scientific discovery that\nthe universe is expanding. They believe\nthis verse is consistent with what\nmodern astronomy has observed.\nAt the same time, some scholars note\nthat the Arabic wording of the verse has\nbeen interpreted in different ways"}, {"page": 10, "text": "throughout history. Because of this, it is\nwise to present the verse with humility\nand avoid claiming that it is a direct\nscientific statement.\nWhether one views this as a remarkable\nharmony between the Qur'an and\nmodern science or simply as a verse\nencouraging reflection, it invites us to\nthink deeply about the vastness and\norder of the universe.\nCONCLUSION:\nThe discovery of the expanding universe\nis one of the greatest achievements of\nmodern astronomy. For many believers,\nthis verse strengthens their appreciation\nof the Qur'an and inspires further study\nof both revelation and the natural world."}]}, {"title": "Water: The origin of life", "start": 11, "end": 14, "pages": [{"page": 11, "text": "Water:The origin of life\nQURANIC VERSES:\n\"And We made from water every living\nthing. Will they not then believe?\"\n[Surah Al-Anbiya (21:30)]\n\"Allah created every living creature from\nwater.\"\n[Surah An-Nur (24:45)]\nMODERN SCIENTIFIC\nUNDERSTANDING:\nModern biology shows that water is\nessential for all known forms of life.\nEvery living cell contains a large amount\nof water, and important biological"}, {"page": 12, "text": "processes such as transporting\nnutrients, regulating temperature, and\ncarrying out chemical reactions depend\non it.\nScientists also believe that the earliest\nlife on Earth developed in environments\nwhere water was present. Because of\nthis, when scientists search for life on\nother planets, one of the first things they\nlook for is evidence of liquid water.\nREFLECTION:\nMany Muslim scholars believe these\nQur'anic verses are consistent with the\nmodern scientific understanding that\nwater is fundamental to life. Although"}, {"page": 13, "text": "the Qur'an is not a biology textbook, it\nhighlights the central importance of\nwater in the existence of living creatures.\nAt the same time, science explains how\nliving organisms depend on water, while\nthe Qur'an reminds believers that life is\npart of Allah's creation and wisdom.\nThese two perspectives address\ndifferent questions and can be\nappreciated together.\nCONCLUSION:\nWater is one of the greatest blessings\non Earth. The Qur'an repeatedly draws\nattention to it, and modern science\nconfirms that without water, life as we"}, {"page": 14, "text": "know it cannot exist. This encourages\nus to value, protect, and be thankful for\nthis precious resource."}]}, {"title": "Human embryonic development", "start": 15, "end": 18, "pages": [{"page": 15, "text": "Human embryonic\ndevelopment\nQURANIC VERSES:\n\"And indeed, We created man from an\nextract of clay. Then We placed him as a\ndrop (nutfah) in a secure place. Then We\nmade the drop into a clinging substance\n('alaqah), then We made the clinging\nsubstance into a chewed-like lump\n(mudghah), then We made the lump into\nbones, and We clothed the bones with\nflesh. Then We developed him into\nanother creation. So blessed is Allah, the\nBest of creators.\""}, {"page": 16, "text": "[Surah Al-Mu'minun (23:12–14)]\nModern scientific understanding:\nModern embryology explains that a\nhuman being begins as a fertilized egg,\nwhich divides into many cells. The\nembryo then attaches to the wall of the\nuterus, where it continues to grow and\ndevelop. Over the following weeks,\ndifferent organs, muscles, bones, and\nbody systems gradually form.\nScientists study these stages using\nmicroscopes, imaging technology, and\nmedical research to understand how the\nhuman body develops before birth."}, {"page": 17, "text": "REFLECTION:\nMany Muslim scholars believe that the\nsequence described in these Qur'anic\nverses is broadly consistent with the\nstages of human development observed\nin modern embryology. They see this as\none of the remarkable passages that\nencourages reflection on the creation of\nhuman life.\nAt the same time, some scientists and\nscholars differ on how closely particular\nArabic terms correspond to modern\nbiological stages. Therefore, it is\nimportant to present these verses\nthoughtfully and avoid claiming that they\ndescribe modern embryology in\ntechnical scientific language."}, {"page": 18, "text": "The Qur'an's main purpose in these\nverses is to remind people of Allah's\npower, wisdom, and the wonder of\nhuman creation.\nCONCLUSION:\nThe development of a human being\nfrom a tiny beginning into a complete\nperson is one of the greatest wonders of\ncreation. The Qur'an invites us to reflect\non this process, while modern science\nhelps us understand many of its\nbiological details. Together, they\nencourage gratitude, curiosity, and\nrespect for human life."}]}, {"title": "The barrier between two seas", "start": 19, "end": 22, "pages": [{"page": 19, "text": "The barrier between two\nseas\nQURANIC VERSES:\n\"He released the two seas, meeting\ntogether. Between them is a barrier\nwhich they do not cross.\"\n[Surah Ar-Rahman (55:19–20)]\n\"And it is He who has released the two\nbodies of water, one fresh and sweet\nand the other salty and bitter, and He\nplaced between them a barrier and a\nforbidding partition.\""}, {"page": 20, "text": "[Surah Al-Furqan (25:53)]\nMODERN SCIENTIFIC\nUNDERSTANDING:\nOceanographers have observed that\nwhen two bodies of water with different\nproperties—such as salinity,\ntemperature, or density—meet, they do\nnot always mix immediately. Instead,\nthere is often a transition zone where\nthe waters gradually mix while still\nretaining many of their distinct\ncharacteristics.\nOne example is where a large river\nmeets the sea. Freshwater and\nsaltwater form an estuary, and because\nof differences in density and salinity,"}, {"page": 21, "text": "they can remain distinguishable before\neventually mixing.\nReflection:\nMany Muslim scholars consider these\nverses to be consistent with the\nscientific observation that different\nbodies of water can be separated by\nnatural boundaries or transition zones.\nHowever, scientists explain these\nboundaries through physical processes\nsuch as density, salinity, currents, and\ntemperature. The Qur'an does not\ndescribe these mechanisms in scientific\ndetail. Its purpose is to encourage\npeople to reflect on the wisdom and\norder found in Allah's creation."}, {"page": 22, "text": "CONCLUSION:\nThe meeting of different bodies of water\nis a fascinating natural phenomenon.\nThe Qur'an draws attention to this sign\nin nature, while modern oceanography\nexplains how and why it occurs.\nTogether, they inspire deeper\nappreciation of the complexity and\nbalance of the natural world."}]}, {"title": "The protective sky", "start": 23, "end": 25, "pages": [{"page": 23, "text": "The protective sky\nQURANIC VERSES:\n\"And We made the sky a protected\nceiling, yet they turn away from its\nsigns.\"\n[Surah Al-Anbiya (21:32)]\nMODERN SCIENTIFIC\nUNDERSTANDING:\nModern science shows that the Earth's\natmosphere plays a vital role in\nprotecting life.\nThe atmosphere:\nShields the Earth from much of the\nSun's harmful ultraviolet (UV) radiation"}, {"page": 24, "text": "through the ozone layer.\n- Causes most small meteoroids to burn\nup before reaching the Earth's surface.\n- Helps regulate the Earth's temperature,\nmaking it suitable for life.\n- Contains oxygen, nitrogen, and other\ngases that living organisms need.\nWithout the atmosphere, life on Earth as\nwe know it would not be possible.\nREFLECTION:\nMany Muslim scholars understand this\nverse as being consistent with the\nprotective functions of the Earth's\natmosphere. They see it as a reminder\nthat the conditions allowing life to exist"}, {"page": 25, "text": "are part of Allah's careful design.\nAt the same time, the Qur'an does not\nexplain the atmosphere in scientific or\ntechnical language. Its primary purpose\nis to encourage people to recognize the\nsigns of Allah in the natural world and to\nreflect on His wisdom.\nCONCLUSION:\nThe Earth's atmosphere is one of the\ngreatest blessings for life. Modern\nscience has revealed many of its\nprotective functions, while the Qur'an\ncalls attention to the sky as a sign\nworthy of reflection. Together, they\nencourage gratitude, curiosity, and a\ndeeper appreciation of the world around\nus."}]}, {"title": "Iron: A remarkable gift", "start": 26, "end": 29, "pages": [{"page": 26, "text": "IRON : A REMARKABLE GIFT\nQURANIC VERSE:\n\"And We sent down iron, wherein is\ngreat strength and benefits for\nmankind...\"\n[Surah Al-Hadid (57:25)]\nMODERN SCIENTIFIC\nUNDERSTANDING:\nIron is one of the most important\nelements for human civilization. It is\nused in buildings, bridges, vehicles,\nmachinery, tools, and countless\neveryday objects. Iron is also essential"}, {"page": 27, "text": "for life, as it helps red blood cells carry\noxygen throughout the human body.\nModern astrophysics has shown that\niron is formed inside massive stars\nthrough nuclear fusion. When these\nstars reach the end of their lives, many\nexplode as supernovae, scattering iron\nand other heavy elements into space.\nOver time, this material became part of\nthe cloud from which our Solar System\nand Earth formed.\nREFLECTION:\nMany Muslim scholars and writers have\nconnected the phrase \"We sent down\niron\" with the scientific understanding"}, {"page": 28, "text": "that iron originated in stars before\nbecoming part of the Earth. They see\nthis as an example of harmony between\nthe Qur'an and modern scientific\nknowledge.\nHowever, other scholars point out that\nthe Arabic expression \"sent down\"\n(anzalnā) can also be understood as\nAllah providing or granting iron to\nhumanity, not necessarily as a scientific\ndescription of its cosmic origin.\nBecause of these different\ninterpretations, it is important to present\nthis topic with humility and avoid\nclaiming that the verse is a direct\nscientific statement.\nRegardless of the interpretation, the"}, {"page": 29, "text": "verse emphasizes the great benefits of\niron and reminds us that natural\nresources are blessings that should be\nused responsibly.\nCONCLUSION:\nIron has transformed human civilization\nand is essential for life itself. Modern\nscience explains how iron was formed in\nancient stars, while the Qur'an highlights\nits strength and benefits for humanity.\nTogether, they encourage reflection on\nthe remarkable resources found in\nAllah's creation."}]}, {"title": "Fingerprints: A sign of individual identity", "start": 30, "end": 33, "pages": [{"page": 30, "text": "FINGERPRINT: A SIGN OF\nINDIVIDUAL IDENTITY\nQURANIC VERSIS:\n\"Does man think that We will not\nassemble his bones? Yes indeed! We\nare fully able even to restore his\nfingertips.\"\n[Surah Al-Qiyamah (75:3–4)]\nMODERN SCIENTIFIC\nUNDERSTANDING:\nModern forensic science has shown that\nevery person's fingerprints are unique.\nEven identical twins, who share the"}, {"page": 31, "text": "same DNA, have different fingerprints.\nFingerprints begin to develop before\nbirth and remain essentially unchanged\nthroughout a person's life, except in\ncases of injury or disease. Because of\ntheir uniqueness, fingerprints are widely\nused for personal identification in law\nenforcement, security systems,\npassports, and smartphones.\nREFLECTION:\nMany Muslim scholars and writers have\nreflected on the Qur'an's specific\nmention of fingertips. They believe that\ndrawing attention to such a small and\ndistinctive part of the human body is"}, {"page": 32, "text": "remarkable, especially since fingerprints\nare now known to be unique to each\nindividual.\nHowever, the primary purpose of these\nverses is to affirm Allah's power to\nresurrect human beings completely. The\nmention of the fingertips emphasizes\nthat no detail of a person is beyond\nAllah's knowledge or ability to recreate.\nWhile some readers see a connection\nwith modern fingerprint science, the\nverse should not be presented as a\ntechnical scientific statement.\nCONCLUSION:\nThe uniqueness of fingerprints is an\nextraordinary feature of human creation."}, {"page": 33, "text": "Modern science uses them for accurate\nidentification, while the Qur'an reminds\nus that Allah has complete knowledge\nand power over every part of His\ncreation, even the smallest details such\nas our fingertips."}]}, {"title": "The orbits of the Sun and the Moon", "start": 34, "end": 37, "pages": [{"page": 34, "text": "THE ORBITS OF THE SUN\nAND THE MOON\nQURAN VERSES:\n\"And it is He who created the night and\nthe day, the Sun and the Moon. Each is\nswimming in an orbit.\"\n[Surah Al-Anbiya (21:33)]\n\"The Sun runs on to its appointed course.\nThat is the decree of the Almighty, the\nAll-Knowing. And for the Moon, We have\ndetermined phases until it returns like\nan old date stalk. It is not for the Sun to\novertake the Moon, nor does the night"}, {"page": 35, "text": "outstrip the day. Each is swimming in an\norbit.\"\n[Surah Ya-Sin (36:38–40)]\nMODERN SCIENTIFIC\nUNDERSTANDING:\nModern astronomy has shown that\ncelestial bodies move in predictable\npaths under the influence of gravity.\n- The Earth orbits the Sun once every\nyear.\n- The Moon orbits the Earth\napproximately every 27.3 days.\n- The Sun itself is also moving, orbiting\nthe center of the Milky Way galaxy. One\ncomplete orbit takes about 225–250"}, {"page": 36, "text": "million years.\nThe Moon also passes through regular\nphases—new moon, crescent, first\nquarter, full moon, and others—which\nare caused by its position relative to the\nEarth and the Sun.\nREFLECTION:\nMany Muslim scholars see these verses\nas being consistent with the scientific\nunderstanding that the Sun and the\nMoon are both in motion. The Qur'an's\ndescription of each \"swimming in an\norbit\" is understood by many as drawing\nattention to the orderly movement of the\nheavenly bodies."}, {"page": 37, "text": "The Qur'an does not describe the details\nof gravity, planetary mechanics, or the\nstructure of the Solar System. Its\npurpose is to encourage people to\nobserve the harmony and precision of\nthe universe and to recognize these as\nsigns of Allah's wisdom.\nCONCLUSION:\nThe regular movement of the Sun, Moon,\nand other celestial bodies is one of the\nmost remarkable features of the\nuniverse. Modern astronomy explains\nthese motions through the laws of\nphysics, while the Qur'an invites\nhumanity to reflect on the order, balance,\nand beauty of the heavens."}]}, {"title": "The mountains and the Earth", "start": 38, "end": 42, "pages": [{"page": 38, "text": "The mountains and the earth"}, {"page": 39, "text": "Quranic verses.\n\"Have We not made the earth a resting\nplace, and the mountains as pegs?\"\n[Surah An-Naba (78:6–7)]\n\"And He placed firmly set mountains\nupon the earth lest it should shake with\nyou...\"\n[Surah An-Nahl (16:15)]\nMODERN SCIENTIFIC\nUNDERSTANDING:\nMountains are formed over millions of\nyears through geological processes\nsuch as the movement of tectonic"}, {"page": 40, "text": "plates, volcanic activity, and uplift of the\nEarth's crust.\nModern geology has shown that many\nmountain ranges have deep roots\nextending below the Earth's surface.\nThese roots help support the mountains\nthrough a process called isostasy,\nsomewhat like how the larger part of an\niceberg lies beneath the water.\nScientists also know that mountains do\nnot completely prevent earthquakes. In\nfact, many major mountain ranges, such\nas the Himalayas, are located in regions\nwhere earthquakes occur because\ntectonic plates are actively moving."}, {"page": 41, "text": "REFLECTION:\nMany Muslim scholars have compared\nthe Qur'anic description of mountains as\n\"pegs\" with the discovery that\nmountains have deep underground roots.\nThey see this as an example of harmony\nbetween the Qur'an and geological\nobservations.\nAt the same time, geologists explain\nthat mountains are formed by tectonic\nprocesses and are not designed to stop\nearthquakes. Therefore, it is important\nnot to overstate the scientific meaning\nof these verses. The Qur'an's primary\npurpose is to draw attention to the\nstability, grandeur, and wisdom found in\nAllah's creation, not to provide a"}, {"page": 42, "text": "technical geology textbook.\nCONCLUSION:\nMountains are among the most\nmagnificent features of the Earth.\nModern geology has revealed their deep\nstructures and how they form, while the\nQur'an invites us to reflect on their\nbeauty, strength, and role in the natural\nworld. Together, they encourage awe,\ngratitude, and a desire to understand\ncreation more deeply."}]}, {"title": "The water cycle", "start": 43, "end": 47, "pages": [{"page": 43, "text": "THE WATER CYCLE\nQURANIC VERSES:\n\"And We send down water from the sky\nin due measure, and We cause it to\nsettle in the earth, and surely We are\nable to take it away.\"\n[Surah Al-Mu'minun (23:18)]\n\"Do you not see that Allah sends down\nrain from the sky, then channels it as\nsprings in the earth?\"\n[Surah Az-Zumar (39:21)]\n\"It is Allah who sends the winds, and\nthey stir up the clouds. Then He spreads\nthem in the sky as He wills and breaks"}, {"page": 44, "text": "them into fragments, and you see the\nrain emerge from within them.\"\n[Surah Ar-Rum (30:48)]\nMODERN SCIENTIFIC\nUNDERSTANDING:\nThe water cycle is one of the most\nimportant natural systems on Earth.\nIt includes several stages:\n- Evaporation: Heat from the Sun causes\nwater from oceans, rivers, and lakes to\nevaporate.\n- Condensation: Water vapor cools and\nforms clouds.\n- Precipitation: Water falls as rain, snow,"}, {"page": 45, "text": "or hail.\n- Infiltration and Groundwater: Some\nrainwater enters the soil, replenishing\nunderground water and springs.\n- Collection: Water returns to rivers,\nlakes, and oceans, where the cycle\nbegins again.\nThis continuous cycle supplies fresh\nwater to plants, animals, and humans.\nREFLECTION:\nMany Muslim scholars point out that the\nQur'an repeatedly refers to rain, clouds,\nwinds, and groundwater. They see these\nverses as being consistent with the\nnatural processes that modern science"}, {"page": 46, "text": "describes as the water cycle.\nThe Qur'an does not explain the\ncomplete scientific mechanism in\ntechnical terms. Instead, it draws\nattention to the wisdom, balance, and\nmercy of Allah in providing water, which\nis essential for all life.\nCONCLUSION:\nWater is one of Allah's greatest\nblessings. Modern science explains how\nthe water cycle operates through natural\nprocesses, while the Qur'an reminds us\nthat these processes are signs to reflect\nupon. Together, they inspire gratitude,\nresponsibility, and respect for the"}, {"page": 47, "text": "environment.\nTHE BEE AND HONEY"}]}, {"title": "The bee and honey", "start": 48, "end": 51, "pages": [{"page": 48, "text": "QURANIC VERSES:\n\"And your Lord inspired the bee: 'Make\nyour homes in the mountains, in the\ntrees, and in what people build. Then eat\nfrom all the fruits and follow the ways of\nyour Lord made easy for you.' From their\nbellies comes a drink of different colors,\nin which there is healing for people.\nSurely in this is a sign for those who\nreflect.\"\n[Surah An-Nahl (16:68–69)]\nMODERN SCIENTIFIC"}, {"page": 49, "text": "UNDERSTANDING:\nHoneybees are among the most\norganized insects on Earth. They live in\ncolonies with a queen, worker bees, and\ndrones. Worker bees collect nectar from\nflowers and convert it into honey\nthrough natural processes inside their\nbodies. The honey is then stored in\nhoneycombs.\nModern scientific research has found\nthat honey contains natural sugars,\nantioxidants, vitamins, minerals, and\nother compounds. Certain types of\nhoney have antibacterial properties and\nare used in medicine, especially for\ntreating some wounds and burns under\nmedical supervision."}, {"page": 50, "text": "However, science also shows that honey\nis not a cure for every disease. Its\nbenefits depend on the type of honey,\nthe condition being treated, and proper\nmedical care.\nREFLECTION:\nThe Qur'an describes honey as\ncontaining \"healing for people.\" Many\nscholars understand this to mean that\nhoney has beneficial healing properties,\nnot necessarily that it cures every illness.\nModern scientific research supports the\nidea that honey can have important\nmedicinal uses in specific situations.\nThe Qur'an also draws attention to the"}, {"page": 51, "text": "remarkable behavior of bees,\nencouraging people to observe the\nnatural world and recognize the wisdom\nof Allah's creation.\nCONCLUSION:\nThe honeybee is a remarkable creature\nwhose work benefits both nature and\nhumanity. Modern science continues to\ndiscover the value of honey and the\nimportance of bees in pollination and\nagriculture. The Qur'an invites us to\nreflect on these blessings and to\nappreciate the signs of Allah in even the\nsmallest of His creations."}]}, {"title": "Darkness in the deep ocean", "start": 52, "end": 56, "pages": [{"page": 52, "text": "DARKNESS IN THE DEEP\nOCEAN\nQURANIC VERSES:\n\"Or they are like layers of darkness in a\ndeep sea, covered by waves, above\nwhich are waves, above which are\nclouds. Layers of darkness, one above\nanother. If a person stretches out his\nhand, he can hardly see it. And whoever\nAllah has not granted light—for him\nthere is no light.\"\n[Surah An-Nur (24:40)]\nMODERN SCIENTIFIC"}, {"page": 53, "text": "UNDERSTANDING:\nThe deep ocean is one of the least\nexplored places on Earth. As sunlight\nenters the sea, it is gradually absorbed\nby the water.\nScientists divide the ocean into different\ndepth zones:\n- Sunlight Zone (0–200 m): Enough\nsunlight reaches this layer for most\nmarine plants to grow.\n- Twilight Zone (200–1,000 m): Very\nlittle sunlight remains.\n- Midnight Zone (below 1,000 m):\nAlmost no sunlight reaches this depth,\nmaking it extremely dark.\nOceanographers have also observed"}, {"page": 54, "text": "that the sea can have different wave\nsystems. Surface waves are caused\nmainly by wind, while underwater waves,\ncalled internal waves, occur between\nlayers of water with different densities.\nThese are not visible from the surface\nbut are detected using scientific\ninstruments.\nREFLECTION:\nMany Muslim scholars believe this verse\nis consistent with observations of the\ndeep ocean, where darkness increases\nwith depth and different types of waves\nexist.\nHowever, the main purpose of this verse"}, {"page": 55, "text": "is spiritual. It uses the image of deep\ndarkness as a powerful example of the\ncondition of those who reject divine\nguidance. The scientific observations\ncan enrich our appreciation of the verse,\nbut they should not overshadow its\ncentral spiritual message.\nCONCLUSION:\nThe deep ocean remains one of the\ngreatest mysteries of our planet.\nModern science has revealed its\ndarkness, immense pressure, and\ncomplex wave systems. The Qur'an\nuses this striking natural scene to invite\npeople to reflect not only on the"}, {"page": 56, "text": "wonders of creation but also on the\nimportance of spiritual guidance."}]}, {"title": "The Big Bang and the origin of the universe", "start": 57, "end": 60, "pages": [{"page": 57, "text": "The Big Bang and the origin\nof the universe\nQURANIC VERSES:\n\"Have those who disbelieved not\nconsidered that the heavens and the\nearth were joined together, then We\nseparated them, and We made from\nwater every living thing? Will they not\nthen believe?\"\n[Surah Al-Anbiya (21:30)]\nMODERN SCIENTIFIC\nUNDERSTANDING:"}, {"page": 58, "text": "According to the current scientific\nmodel, the universe began about 13.8\nbillion years ago in an extremely hot and\ndense state. This event is known as the\nBig Bang.\nAs the universe expanded, matter and\nenergy spread out. Over billions of years,\ngalaxies, stars, planets, and eventually\nEarth formed. This model is supported\nby several lines of evidence, including:\n- The expansion of the universe.\n- The cosmic microwave background\nradiation.\n- The observed abundance of light\nelements such as hydrogen and helium.\nIt is important to note that the Big Bang"}, {"page": 59, "text": "theory describes the early development\nof the universe. It does not answer\nphilosophical or theological questions\nabout why the universe exists.\nREFLECTION:\nMany Muslim scholars and writers see a\npossible connection between Surah Al-\nAnbiya (21:30) and the modern idea that\nthe universe was once in a unified state\nbefore expanding.\nAt the same time, many scholars\ncaution that the Qur'an does not present\na scientific theory of cosmology. The\nverse has been interpreted in different\nways throughout Islamic history, and it"}, {"page": 60, "text": "should not be claimed that it is a direct\ndescription of the Big Bang.\nThe Qur'an's purpose is to encourage\nreflection on the creation of the heavens\nand the Earth and to recognize the\nwisdom and power of Allah.\nCONCLUSION:\nThe origin of the universe remains one\nof the greatest questions in science and\nphilosophy. Modern cosmology provides\na detailed scientific model of the\nuniverse's early history, while the Qur'an\ninvites humanity to reflect on the\nexistence and order of creation. For\nmany believers, these two perspectives"}]}, {"title": "Pain receptors in the skin", "start": 61, "end": 64, "pages": [{"page": 61, "text": "together inspire wonder, humility, and\ngratitude toward the Creator.Pain\nreceptors in the skin\nQuranic verses:\n\"Indeed, those who reject Our signs—We\nwill cast them into the Fire. Whenever\ntheir skins are burned through, We will\nreplace them with other skins so that\nthey may taste the punishment. Indeed,\nAllah is Almighty, All-Wise.\"\n[Surah An-Nisa (4:56)]\nModern scientific understanding:"}, {"page": 62, "text": "Modern biology has shown that the skin\nis not merely a covering for the body. It\ncontains specialized nerve endings that\nallow us to feel pain, pressure, heat, cold,\nand touch.\nWhen the skin is severely damaged, the\nability to feel pain in that area may be\nreduced because the nerve endings\nhave been destroyed. Scientists now\nunderstand that pain sensation is\nclosely linked to the nervous system and\nthe receptors present in the skin.\nReflection:\nMany Muslim writers have pointed to"}, {"page": 63, "text": "this verse and noted that it specifically\nmentions the replacement of skin in\nconnection with the experience of pain.\nThey see this as being consistent with\nthe modern understanding that the skin\nplays an important role in pain sensation.\nHowever, the primary purpose of the\nverse is not to teach anatomy or\nneuroscience. Rather, it is a warning\nabout accountability and the\nconsequences of rejecting God's\nguidance. Any scientific observations\nshould be viewed as secondary to the\nverse's spiritual message.\nConclusion:"}, {"page": 64, "text": "The human skin is a remarkable organ\nwith many functions, including its role in\nsensing the world around us. Modern\nscience has revealed much about how\npain is experienced, while the Qur'an\nuses the skin as part of a powerful\nreminder about responsibility, justice,\nand the reality of the Hereafter."}]}, {"title": "Final thoughts: Faith and science", "start": 65, "end": 67, "pages": [{"page": 65, "text": "Final thoughts: faith and\nscience\nThroughout this book, we have explored\na number of Qur'anic verses alongside\nmodern scientific discoveries. Topics\nsuch as the expanding universe, water\nand life, embryonic development, the\natmosphere, iron, fingerprints, the water\ncycle, bees, the deep ocean, and the\norigin of the universe have inspired\nmany people to reflect on the\nrelationship between faith and science."}, {"page": 66, "text": "Science seeks to understand how the\nnatural world works through observation,\nexperimentation, and evidence. The\nQur'an, on the other hand, is a book of\nguidance whose primary purpose is to\ndirect humanity toward faith, morality,\nand reflection on the signs of Allah.\nFor many believers, scientific\ndiscoveries increase their appreciation\nof the Qur'an and the wonders of\ncreation. At the same time, it is\nimportant to approach both science and\nscripture with humility, recognizing that\nscientific knowledge develops over time\nand that Qur'anic verses may have\nmultiple layers of meaning.\nThe Qur'an repeatedly invites people to"}, {"page": 67, "text": "think, observe, learn, and reflect.\nWhether one approaches these verses\nfrom a scientific, spiritual, or\nphilosophical perspective, they\nencourage a sense of wonder about the\nuniverse and our place within it.\nMay this exploration inspire readers to\nseek knowledge, strengthen their\nunderstanding, and deepen their\nappreciation for the signs of Allah in the\nworld around them."}]}, {"title": "About the author", "start": 68, "end": 69, "pages": [{"page": 68, "text": "About the author\nArshid Ahmad Parray is a student with a\nstrong interest in the Holy Qur'an,\nscience, and learning. He believes that\nknowledge grows through study,\nreflection, and respectful discussion.\nInspired by the Qur'an's encouragement\nto observe the natural world, he began\nresearching topics that many scholars\nrelate to modern scientific discoveries.\nThrough this book, he hopes to\nencourage readers to reflect on the\nsigns of Allah in creation, increase their"}, {"page": 69, "text": "appreciation of knowledge, and continue\nexploring both faith and science with\nsincerity."}]}];
const toc=document.getElementById('toclist'),book=document.getElementById('book');

sections.forEach((s,i)=>{const b=document.createElement('button');b.innerHTML=esc(s.title)+'<span>Printed page '+s.start+'</span>';b.onclick=()=>document.getElementById('sec'+i).scrollIntoView({behavior:'smooth'});toc.appendChild(b);const sec=document.createElement('section');sec.className='section';sec.id='sec'+i;sec.dataset.title=s.title.toLowerCase();let inner='<h2>'+esc(s.title)+'</h2>';s.pages.forEach(p=>{inner+='<div class="page"><div class="page-label">Page '+p.page+'</div><div class="page-text">'+esc(p.text)+'</div></div>'});sec.innerHTML=inner;book.appendChild(sec)});
document.getElementById('search').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase();let hits=0;document.querySelectorAll('.section').forEach(s=>{const yes=!q||s.innerText.toLowerCase().includes(q);s.classList.toggle('hidden',!yes);if(yes)hits++});let old=document.getElementById('noresults');if(old)old.remove();if(q&&hits===0){const n=document.createElement('div');n.id='noresults';n.className='noresults';n.textContent='No matching text found.';book.prepend(n)}});
